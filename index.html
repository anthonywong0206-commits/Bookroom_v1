<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1976e9" />
  <meta name="description" content="房間及物品預約、審批及狀態查詢系統" />
  <title>房間及物品預約系統</title>
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=20260909v7" />
</head>
<body>
  <div id="app"><div class="boot-screen"><div class="boot-logo">⌚</div><div>正在載入預約系統…</div></div></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="config.js"></script>
  <script>
    (function () {
      function loadApp() {
        var script = document.createElement('script');
        script.src = 'app.js?v=20260909v7';
        script.onerror = function () {
          document.getElementById('app').innerHTML = '<div class="boot-screen"><div>前台程式載入失敗，請確認 app.js 已上載。</div></div>';
        };
        document.body.appendChild(script);
      }
      if ((window.APP_CONFIG || {}).demoMode !== false) {
        loadApp();
        return;
      }
      var supabaseScript = document.createElement('script');
      supabaseScript.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      supabaseScript.onload = loadApp;
      supabaseScript.onerror = function () {
        document.getElementById('app').innerHTML = '<div class="boot-screen"><div>Supabase 程式庫載入失敗，請檢查網絡連線。</div></div>';
      };
      document.head.appendChild(supabaseScript);
    })();
  </script>
</body>
</html>
