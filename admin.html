<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1976e9" />
  <meta name="robots" content="noindex,nofollow" />
  <title>管理員後台｜房間及物品預約系統</title>
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    .desktop-only-admin-message{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#17345f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}.desktop-only-admin-message>div{max-width:440px;background:#fff;border:1px solid #e0e9f6;border-radius:24px;padding:28px;text-align:center;box-shadow:0 12px 30px rgba(43,78,128,.1)}.desktop-only-admin-message h1{font-size:1.3rem;margin:0 0 12px}.desktop-only-admin-message p{color:#7186a4;line-height:1.6;margin:0}
  </style>
</head>
<body>
  <div id="app"><div class="boot-screen"><div class="boot-logo">⌚</div><div>正在載入管理員後台…</div></div></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="config.js"></script>
  <script>
    if (window.matchMedia('(min-width: 900px)').matches) {
      const script = document.createElement('script');
      script.src = 'admin-app.js';
      script.defer = true;
      document.body.appendChild(script);
    } else {
      document.getElementById('app').innerHTML = '<div class="desktop-only-admin-message"><div><h1>管理員後台只於網頁版顯示</h1><p>請使用電腦瀏覽器，或把瀏覽器切換至桌面網站模式後再登入管理員後台。</p></div></div>';
    }
  </script>
</body>
</html>
